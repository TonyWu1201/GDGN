[project]
name = "srtp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.87",
    "captum>=0.9.0",
    "deepchem>=2.8.0",
    "gseapy>=1.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pubchempy>=1.0.5",
    "pyarrow>=25.0.1",
    "pyg-lib",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.3",
    "scanpy>=1.12.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch==2.12",
    "torch-geometric>=2.8.0",
    "torch-scatter",
    "torch-sparse",
    "torchvision",
    "tqdm>=4.68.3",
    "transformers>=5.13.0",
]

[tool.uv.sources]
pyg-lib = [
    { index = "pyg-cu126" },
]
torch-scatter = [
    { index = "pyg-cu126" },
]
torch-sparse = [
    { index = "pyg-cu126" },
]
torch = [
    { index = "pytorch-cu126" },
]
torchvision = [
    { index = "pytorch-cu126" },
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
explicit = true
format = "flat"

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-sparse = ["torch"]

[dependency-groups]
dev = [
    "pytest",
]
